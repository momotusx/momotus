[workspace]
resolver = "2"
members = ["crates/*"]
# Vendored forks build as path dependencies, outside our lint and fmt gates.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
publish = false

[workspace.dependencies]
stremio-core = { git = "https://github.com/Stremio/stremio-core", rev = "c4806e8614452fd49d5dbb22db74afa88959b554" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"

# Line tables keep backtraces readable at a fraction of the disk full debug
# info takes (every test file is its own binary).
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
# Smallest code by default: the Android library has a 12 MB budget. The
# crates on hot paths below keep speed.
opt-level = "z"
strip = true

[profile.release.package.regex-automata]
opt-level = 3
[profile.release.package.aho-corasick]
opt-level = 3
[profile.release.package.mq-relparse]
opt-level = 3
[profile.release.package.libsqlite3-sys]
opt-level = "s"

# Regex-heavy parsing is far too slow unoptimized; keep debug builds usable.
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.mq-relparse]
opt-level = 2
