# One daemon, modest heap, no parallel module builds: the machine is shared.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.configuration-cache=true
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Accounts (plans/accounts.md section 9, the owner's): the hosted sync service, the link host and the Google
# web client id. Empty: no hosted default, no passkeys, Google through the relay's brokered flow. An empty
# googleWebClientId takes GOOGLE_WEB_CLIENT_ID from the repository's gitignored .env.accounts.local.
marquee.syncServer=
marquee.linkHost=
marquee.googleWebClientId=
# A walk build's package suffix (.walk): its own app beside the owner's. Empty: app.momotus.android.
marquee.applicationIdSuffix=
# Error reports (plans/error-reports.md 5.1): release builds send them; a debug or walk build only with
# -Pmarquee.reports=true, for a live check.
marquee.reports=false
# Updates (plans/auto-update.md): the feed a walk reads (empty: the GitHub feed in a release build of
# app.momotus.android, none in every other build), the base64 P-256 public key it is signed with (empty: the
# release key) and the version a walk build says it is (empty: the release's).
marquee.updateFeed=
marquee.updateKey=
marquee.version=
