<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- The page color (design/tokens.json bg), for the browser bar on a phone. -->
    <meta name="theme-color" content="#1C1C1E" />
    <title>Momotus</title>
    <!-- Icons and the install manifest: design/logo/build.ts. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <!-- The mark and the name until the app draws (main.tsx clears it), styled here
         since the stylesheets come with the script. -->
    <div id="root"><div class="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:23px;background:#1C1C1E"><img src="/brand/mark.webp" alt="" style="width:81px;height:81px" /><img src="/brand/wordmark.svg" alt="Momotus" style="height:36px" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
