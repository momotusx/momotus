<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- The page color (design/tokens.json bg), for the browser bar on a phone. -->
    <meta name="theme-color" content="#1C1C1E" />
    <title>Momotus</title>
    <!-- Icons and the install manifest: design/logo/build.ts. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <!-- The mark and the name until the app draws (main.tsx clears it), styled here since the stylesheets come
         with the script: the first frame of the app's own boot (.boot.brand), faint, so nothing jumps. -->
    <div id="root"><div class="boot" role="status" aria-label="Momotus is starting" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;background:#1C1C1E"><img src="/brand/mark.webp" alt="" style="width:81px;height:81px;opacity:.2" /><img src="/brand/wordmark.svg" alt="" style="height:36px;opacity:.2" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
