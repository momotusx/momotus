[package]
name = "momotus-win"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The Windows app (plans/windows-app.md): one WebView2 window over the web app, which mq-bridge.exe (the core,
# started beside it) serves. Built on GitHub's Windows runner; off Windows main.rs is a stub, so the Mac and
# Linux gates compile no WebView code.
[[bin]]
name = "Momotus"
path = "src/main.rs"

# The update feed's check (src/feed.rs), on every platform so its tests run on every gate.
[dependencies]
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
serde_json = { workspace = true }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = "0.57"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
