# Generate with: xcodegen generate --spec apps/apple/project.yml
# The core must be built first: apps/apple/scripts/build-core.sh [--tvos]
name: Marquee
options:
  bundleIdPrefix: app.marquee
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Marquee
    # Local and simulator runs only: ad hoc signing, no team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    # Accounts (plans/accounts.md 9): the hosted relay first run signs in to, and the
    # link host (passkey RP ID, universal links). Empty keeps today's first run.
    MARQUEE_SYNC_SERVER: ""
    MARQUEE_LINK_HOST: ""
    # The owner's App ID carries Sign in with Apple and associated domains only after
    # owner steps 1 and 3: until then no build asks for them (an ad hoc Mac build with
    # them would not launch). Set to Marquee/Marquee.entitlements once they exist.
    MARQUEE_ENTITLEMENTS: ""
targetTemplates:
  App:
    type: application
    sources:
      - path: Marquee
        excludes: ["Resources/**", "Marquee.entitlements"]
      - path: Marquee/Resources/Fonts
        type: folder
        buildPhase: resources
      # Lucide icons (ISC), generated by scripts/gen-icons.ts.
      - path: Marquee/Resources/Icons.xcassets
        buildPhase: resources
      - path: Marquee/Resources/LICENSE-lucide.txt
        buildPhase: resources
      # Stream choice words, shared with the web and Android.
      - path: ../shared/stream-choice-words.json
        buildPhase: resources
      # Account words, shared with the web and Android.
      - path: ../shared/account-words.json
        buildPhase: resources
      - path: Core/marquee_core.swift
    dependencies:
      - framework: Core/MarqueeCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      # A core built with debug assertions (build-core.sh --dev) carries the dev hooks (the loopback
      # Trakt hook, MQ_DEV_TRAKT, and the e2e recorder's set_dev_replay): it never goes into a Release
      # build or an archive. Checked on the libraries themselves, every slice.
      - name: Refuse a dev core outside Debug
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Core/MarqueeCore.xcframework/Info.plist
        script: |
          [ "$CONFIGURATION" = "Debug" ] && exit 0
          for lib in "$SRCROOT"/Core/MarqueeCore.xcframework/*/libmarquee_core.a; do
            if grep -aqE 'MQ_DEV_|set_dev_replay' "$lib"; then
              echo "error: $lib is a --dev core (debug assertions, the loopback Trakt hook). Run apps/apple/scripts/build-core.sh without --dev first."
              exit 1
            fi
          done
      # The entitlements name the link host (applinks, webcredentials): never an empty one.
      - name: Refuse entitlements without a link host
        basedOnDependencyAnalysis: false
        script: |
          if [ -n "$MARQUEE_ENTITLEMENTS" ] && [ -z "$MARQUEE_LINK_HOST" ]; then
            echo "error: MARQUEE_ENTITLEMENTS is set but MARQUEE_LINK_HOST is empty: the associated domains would name no host."
            exit 1
          fi
    settings:
      base:
        PRODUCT_NAME: Marquee
        PRODUCT_MODULE_NAME: Marquee
        PRODUCT_BUNDLE_IDENTIFIER: app.marquee.dev
        # The asset catalog holds icons only; there is no app icon set yet.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: $(MARQUEE_ENTITLEMENTS)
targets:
  Marquee-macOS:
    templates: [App]
    platform: macOS
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MarqueeSyncServer: $(MARQUEE_SYNC_SERVER)
        MarqueeLinkHost: $(MARQUEE_LINK_HOST)
    settings:
      base:
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets: [MarqueeTests]
  Marquee-iOS:
    templates: [App]
    platform: iOS
    # A film keeps playing with the screen locked (and in Picture in Picture).
    info:
      path: Generated/Info-iOS.plist
      properties:
        UIBackgroundModes: [audio]
        # xcodegen writes 1.0 and 1 otherwise, over the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MarqueeSyncServer: $(MARQUEE_SYNC_SERVER)
        MarqueeLinkHost: $(MARQUEE_LINK_HOST)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Making a recovery kit, removing a device or reporting one lost checks that it is you.
        INFOPLIST_KEY_NSCameraUsageDescription: The camera reads the code a new device shows, to add it to your sync account.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Dark only (design v2), from the launch screen on.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme: {}
  Marquee-tvOS:
    templates: [App]
    platform: tvOS
    info:
      path: Generated/Info-tvOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MarqueeSyncServer: $(MARQUEE_SYNC_SERVER)
        MarqueeLinkHost: $(MARQUEE_LINK_HOST)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"
        # A plain launch screen, and dark from it on (the keyboard and alerts too), as on iOS.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    scheme: {}
  # Model tests: decoding of recorded core JSON, applyDiffs, the rules, and
  # the models that run on a real core opened in a temporary directory. No host app.
  MarqueeTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - framework: Core/MarqueeCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    sources:
      - path: Tests
        excludes: ["Fixtures/**"]
      - path: ../shared/stream-choice-words.json
        buildPhase: resources
      - path: ../shared/account-words.json
        buildPhase: resources
      - path: Marquee/Account/AccountWords.swift
      - path: Marquee/Account/AccountRules.swift
      - path: Marquee/Account/PasskeyContract.swift
      - path: Marquee/Account/AccountWipe.swift
      - path: Marquee/Account/SignInFlow.swift
      - path: Marquee/Account/SignInSheets.swift
      - path: Marquee/Versions/StreamChoice.swift
      - path: Marquee/Core/Models.swift
      # The rating chip, measured with real text layout (Tests/RatingChipTests.swift).
      - path: Marquee/Common/RatingChip.swift
      - path: Marquee/Theme/ThemeSupport.swift
      - path: Marquee/Theme/Theme.generated.swift
      - path: Marquee/Core/PlaybackModels.swift
      - path: Marquee/Core/ScreenModels.swift
      - path: Marquee/Core/AccountModels.swift
      - path: Marquee/Core/ListDiff.swift
      - path: Marquee/Title/TitleWords.swift
      - path: Marquee/App/TabBarRule.swift
      - path: Marquee/Common/ChipRule.swift
      - path: Marquee/Versions/VersionWords.swift
      - path: Marquee/Core/ProfileModels.swift
      - path: Marquee/Core/DebridModels.swift
      - path: Marquee/Core/DebridStore.swift
      - path: Marquee/Core/DebridAccounts.swift
      - path: Marquee/Player/WebVTT.swift
      - path: Marquee/Player/PlayerLayout.swift
      - path: Marquee/Theme/FocusRule.swift
      - path: Marquee/Theme/BackdropStops.swift
      - path: Marquee/Player/CaptionStyle.swift
      - path: Marquee/Sync/SyncWords.swift
      - path: Marquee/Settings/FindAddonsWords.swift
      - path: Marquee/Settings/FindAddonsRules.swift
      - path: Marquee/Core/CoreError.swift
      - path: Marquee/Theme/ArtLoader.swift
      - path: Core/marquee_core.swift
      - path: Marquee/Core/CoreClient.swift
      - path: Marquee/Core/CoreRouter.swift
      - path: Marquee/Core/DeviceId.swift
      - path: Marquee/Core/LiveRecord.swift
      - path: Marquee/App/Launch.swift
      - path: Marquee/Sync/SyncModel.swift
      - path: Marquee/Sync/SyncRecord.swift
      - path: Marquee/Sync/KitLedger.swift
      - path: Marquee/Sync/Clipboard.swift
      - path: Marquee/Settings/FindAddonsPage.swift
      - path: Marquee/Profiles/ProfileSession.swift
      - path: Marquee/Trakt/TraktModel.swift
      - path: Marquee/Trakt/TraktWords.swift
      - path: Marquee/Core/TraktModels.swift
      - path: Marquee/Settings/AddonSetup.swift
      - path: Marquee/Settings/Language.swift
      - path: Marquee/Onboarding/SubtitleStepRules.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.marquee.dev.tests
        GENERATE_INFOPLIST_FILE: YES
