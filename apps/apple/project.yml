# Generate with: xcodegen generate --spec apps/apple/project.yml
# The core must be built first: apps/apple/scripts/build-core.sh [--tvos]
name: Marquee
options:
  bundleIdPrefix: app.marquee
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true
# The second player engine, for what AVPlayer does not open (plans/apple-second-engine.md).
packages:
  AetherEngine:
    path: Vendor/AetherEngine
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Momotus
    # Local and simulator runs only: ad hoc signing, no team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    # Accounts (plans/accounts.md 9): the hosted relay first run signs in to, and the
    # link host (passkey RP ID, universal links). Empty keeps today's first run.
    MARQUEE_SYNC_SERVER: ""
    MARQUEE_LINK_HOST: ""
    # The owner's App ID carries Sign in with Apple and associated domains only after
    # owner steps 1 and 3: until then no build asks for them (an ad hoc Mac build with
    # them would not launch). Set to Marquee/Marquee.entitlements once they exist.
    MARQUEE_ENTITLEMENTS: ""
    # own: the core carries the torrent engine, checked before the app compiles; store: a store core,
    # engine-free on purpose (STORE=1 for build-core.sh). The app reads it as MarqueeCoreBuild.
    MARQUEE_CORE_BUILD: own
    # A walk build (plans/apple-second-engine.md section 3): Release with MARQUEE_WALK_BUILD="DEBUG MARQUEE_WALK"
    # and MARQUEE_CORE_BUILD=own on the xcodebuild line (without it a Release build is a store build, the second
    # engine off; the launch log says which), the walk hooks and the sampler compiled into the app only, never
    # into the engine.
    MARQUEE_WALK_BUILD: ""
    # The app's bundle id; a walk build takes its own (app.marquee.walk) so it never installs over the owner's app.
    MARQUEE_APP_ID: app.marquee.dev
  configs:
    # A Release build (an archive) is a store build unless it says otherwise: MARQUEE_CORE_BUILD=own on the
    # xcodebuild line for an own Release build, so the second engine is never on in an archive by accident (the
    # torrent core is its own choice: STORE=1 for build-core.sh).
    Release:
      MARQUEE_CORE_BUILD: store
targetTemplates:
  App:
    type: application
    sources:
      - path: Marquee
        excludes: ["Resources/**", "Marquee.entitlements"]
      - path: Marquee/Resources/Fonts
        type: folder
        buildPhase: resources
      # Lucide icons (ISC), generated by scripts/gen-icons.ts.
      - path: Marquee/Resources/Icons.xcassets
        buildPhase: resources
      - path: Marquee/Resources/LICENSE-lucide.txt
        buildPhase: resources
      # The playback libraries' licence texts (Settings, About).
      - path: Marquee/Resources/Licences
        type: folder
        buildPhase: resources
      # Language flags (circle-flags, MIT), generated by scripts/gen-flags.ts.
      - path: Marquee/Resources/Flags.xcassets
        buildPhase: resources
      - path: Marquee/Resources/LICENSE-circle-flags.txt
        buildPhase: resources
      # The title page's service marks, from design/marks (README there).
      - path: Marquee/Resources/Marks.xcassets
        buildPhase: resources
      # Stream choice words, shared with the web and Android.
      - path: ../shared/stream-choice-words.json
        buildPhase: resources
      # Account words, shared with the web and Android.
      - path: ../shared/account-words.json
        buildPhase: resources
      - path: Core/marquee_core.swift
    dependencies:
      - framework: Core/MarqueeCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - package: AetherEngine
    preBuildScripts:
      # A core built with debug assertions (build-core.sh --dev) carries the dev hooks (the loopback
      # Trakt hook, MQ_DEV_TRAKT, and the e2e recorder's set_dev_replay): it never goes into a Release
      # build or an archive. Checked on the libraries themselves, every slice.
      - name: Refuse a dev core outside Debug
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Core/MarqueeCore.xcframework/Info.plist
        script: |
          [ "$CONFIGURATION" = "Debug" ] && exit 0
          for lib in "$SRCROOT"/Core/MarqueeCore.xcframework/*/libmarquee_core.a; do
            if grep -aqE 'MQ_DEV_|set_dev_replay' "$lib"; then
              echo "error: $lib is a --dev core (debug assertions, the loopback Trakt hook). Run apps/apple/scripts/build-core.sh without --dev first."
              exit 1
            fi
          done
      # An own build links a core with the torrent engine (plans/play-every-version.md, Phase 0): the
      # xcframework is gitignored and can be stale or hand-built, so every slice is checked for the mark.
      - name: Refuse a core without the engine
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Core/MarqueeCore.xcframework/Info.plist
        script: |
          store=""
          if [ "$MARQUEE_CORE_BUILD" = store ]; then store=1; fi
          if ! STORE="$store" "$SRCROOT/scripts/check-engine.sh" "$SRCROOT"/Core/MarqueeCore.xcframework/*/libmarquee_core.a; then
            echo "error: the linked core has no torrent engine. Run apps/apple/scripts/build-core.sh, or set MARQUEE_CORE_BUILD=store for a store build."
            exit 1
          fi
      # The entitlements name the link host (applinks, webcredentials): never an empty one.
      - name: Refuse entitlements without a link host
        basedOnDependencyAnalysis: false
        script: |
          if [ -n "$MARQUEE_ENTITLEMENTS" ] && [ -z "$MARQUEE_LINK_HOST" ]; then
            echo "error: MARQUEE_ENTITLEMENTS is set but MARQUEE_LINK_HOST is empty: the associated domains would name no host."
            exit 1
          fi
    settings:
      base:
        # The name people see (the .app, the Mac menu bar); the Swift module keeps its own.
        PRODUCT_NAME: Momotus
        PRODUCT_MODULE_NAME: Marquee
        PRODUCT_BUNDLE_IDENTIFIER: $(MARQUEE_APP_ID)
        # The asset catalog holds icons only; there is no app icon set yet.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: $(MARQUEE_ENTITLEMENTS)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(MARQUEE_WALK_BUILD)
targets:
  Marquee-macOS:
    templates: [App]
    platform: macOS
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MarqueeSyncServer: $(MARQUEE_SYNC_SERVER)
        MarqueeLinkHost: $(MARQUEE_LINK_HOST)
        MarqueeCoreBuild: $(MARQUEE_CORE_BUILD)
    settings:
      base:
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets: [MarqueeTests]
  Marquee-iOS:
    templates: [App]
    platform: iOS
    # A film keeps playing with the screen locked (and in Picture in Picture).
    info:
      path: Generated/Info-iOS.plist
      properties:
        UIBackgroundModes: [audio]
        # xcodegen writes 1.0 and 1 otherwise, over the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MarqueeSyncServer: $(MARQUEE_SYNC_SERVER)
        MarqueeLinkHost: $(MARQUEE_LINK_HOST)
        MarqueeCoreBuild: $(MARQUEE_CORE_BUILD)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Making a recovery kit, removing a device or reporting one lost checks that it is you.
        INFOPLIST_KEY_NSCameraUsageDescription: The camera reads the code a new device shows, to add it to your sync account.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Dark only (design v2), from the launch screen on.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme: {}
  Marquee-tvOS:
    templates: [App]
    platform: tvOS
    info:
      path: Generated/Info-tvOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MarqueeSyncServer: $(MARQUEE_SYNC_SERVER)
        MarqueeLinkHost: $(MARQUEE_LINK_HOST)
        MarqueeCoreBuild: $(MARQUEE_CORE_BUILD)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"
        # A plain launch screen, and dark from it on (the keyboard and alerts too), as on iOS.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    scheme: {}
  # Model tests: decoding of recorded core JSON, applyDiffs, the rules, and
  # the models that run on a real core opened in a temporary directory. No host app.
  MarqueeTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - framework: Core/MarqueeCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      # The vendored engine's patches, run for real (Tests/EnginePatchTests.swift).
      - package: AetherEngine
    sources:
      - path: Tests
        excludes: ["Fixtures/**"]
      - path: ../shared/stream-choice-words.json
        buildPhase: resources
      - path: ../shared/account-words.json
        buildPhase: resources
      - path: Marquee/Account/AccountWords.swift
      - path: Marquee/Account/AccountRules.swift
      - path: Marquee/Account/PasskeyContract.swift
      - path: Marquee/Account/AccountWipe.swift
      - path: Marquee/Account/SignInFlow.swift
      - path: Marquee/Account/SignInSheets.swift
      - path: Marquee/Versions/StreamChoice.swift
      - path: Marquee/Core/Models.swift
      - path: Marquee/Theme/ThemeSupport.swift
      - path: Marquee/Theme/Theme.generated.swift
      - path: Marquee/Core/PlaybackModels.swift
      - path: Marquee/Core/ScreenModels.swift
      - path: Marquee/Core/AccountModels.swift
      - path: Marquee/Core/ListDiff.swift
      - path: Marquee/Title/TitleWords.swift
      - path: Marquee/App/TabBarRule.swift
      - path: Marquee/App/Places.swift
      - path: Marquee/App/SearchInput.swift
      - path: Marquee/Discover/DiscoverRules.swift
      - path: Marquee/Common/ChipRule.swift
      - path: Marquee/Versions/VersionWords.swift
      - path: Marquee/Core/ProfileModels.swift
      - path: Marquee/Core/DebridModels.swift
      - path: Marquee/Core/DebridStore.swift
      - path: Marquee/Core/DebridAccounts.swift
      - path: Marquee/Player/WebVTT.swift
      - path: Marquee/Player/AetherSession.swift
      - path: Marquee/Player/LegibleLog.swift
      - path: Marquee/Player/PlayerLayout.swift
      - path: Marquee/Player/SwipeRules.swift
      # The second engine's switch and routing (Tests/EngineChoiceTests.swift).
      - path: Marquee/Player/EngineChoice.swift
      - path: Marquee/Player/DeviceCaps.swift
      - path: Marquee/Player/FlagSet.swift
      - path: Marquee/Theme/FocusRule.swift
      - path: Marquee/Theme/BackdropStops.swift
      # The hero box, laid out for real in Tests/HeroFrameTests.swift.
      - path: Marquee/Home/HeroFrame.swift
      # Own or store build beside the core's engine (Tests/CoreBuildTests.swift).
      - path: Marquee/App/CoreBuild.swift
      # A catalog tile, laid out for real in Tests/PosterRowTests.swift.
      - path: Marquee/Home/PosterTile.swift
      # The title hero, laid out from plain values in Tests/TitleHeroTests.swift, with what it draws with.
      - path: Marquee/Home/HeroLayout.swift
      - path: Marquee/Home/HeroText.swift
      - path: Marquee/Theme/Glyph.swift
      - path: Marquee/Title/TitleHero.swift
      - path: Marquee/Title/TitleScores.swift
      - path: Marquee/Title/TitleEpisodes.swift
      - path: Marquee/Title/TitleActions.swift
      - path: Marquee/Theme/Components.swift
      - path: Marquee/Player/CaptionStyle.swift
      - path: Marquee/Sync/SyncWords.swift
      - path: Marquee/Settings/FindAddonsWords.swift
      - path: Marquee/Settings/FindAddonsRules.swift
      - path: Marquee/Core/CoreError.swift
      - path: Marquee/Theme/ArtLoader.swift
      - path: Core/marquee_core.swift
      - path: Marquee/Core/CoreClient.swift
      - path: Marquee/Core/CoreRouter.swift
      - path: Marquee/Core/DeviceId.swift
      - path: Marquee/Core/LiveRecord.swift
      - path: Marquee/App/Launch.swift
      - path: Marquee/Sync/SyncModel.swift
      - path: Marquee/Sync/SyncRecord.swift
      - path: Marquee/Sync/KitLedger.swift
      - path: Marquee/Sync/Clipboard.swift
      - path: Marquee/Settings/FindAddonsPage.swift
      - path: Marquee/Profiles/ProfileSession.swift
      - path: Marquee/Trakt/TraktModel.swift
      - path: Marquee/Trakt/TraktWords.swift
      - path: Marquee/Core/TraktModels.swift
      - path: Marquee/Settings/AddonSetup.swift
      - path: Marquee/Settings/Language.swift
      - path: Marquee/Onboarding/SubtitleStepRules.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.marquee.dev.tests
        GENERATE_INFOPLIST_FILE: YES
  # The iPhone walk of plans/player-gestures.md 7.2: real touches on the player, which only XCUITest gives a phone.
  # Its own scheme; in no app's scheme, and no app target depends on it. Run only through scripts/walk-ui.sh.
  MarqueeWalkUITests:
    type: bundle.ui-testing
    platform: iOS
    # The host app is built under the walk's own bundle id or not at all: xcodebuild installs it before any test runs.
    preBuildScripts:
      - name: Refuse any app id but the walk's
        basedOnDependencyAnalysis: false
        script: |
          if [ "$MARQUEE_APP_ID" != app.marquee.walk ]; then
            echo "error: MarqueeWalkUITests builds the app as app.marquee.walk only (scripts/walk-ui.sh), not $MARQUEE_APP_ID."
            exit 1
          fi
    sources:
      - path: WalkUITests
    dependencies:
      - target: Marquee-iOS
    settings:
      base:
        TEST_TARGET_NAME: Marquee-iOS
        PRODUCT_BUNDLE_IDENTIFIER: app.marquee.walk.uitests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets: [MarqueeWalkUITests]
