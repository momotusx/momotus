# Generate with: xcodegen generate --spec apps/apple/project.yml
# The core must be built first: apps/apple/scripts/build-core.sh [--tvos]
name: Marquee
options:
  bundleIdPrefix: app.marquee
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Marquee
    # Local and simulator runs only: ad hoc signing, no team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
targetTemplates:
  App:
    type: application
    sources:
      - path: Marquee
        excludes: ["Resources/**"]
      - path: Marquee/Resources/Fonts
        type: folder
        buildPhase: resources
      # Lucide icons (ISC), generated by scripts/gen-icons.ts.
      - path: Marquee/Resources/Icons.xcassets
        buildPhase: resources
      - path: Marquee/Resources/LICENSE-lucide.txt
        buildPhase: resources
      - path: Core/marquee_core.swift
    dependencies:
      - framework: Core/MarqueeCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_NAME: Marquee
        PRODUCT_MODULE_NAME: Marquee
        PRODUCT_BUNDLE_IDENTIFIER: app.marquee.dev
        # The asset catalog holds icons only; there is no app icon set yet.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
targets:
  Marquee-macOS:
    templates: [App]
    platform: macOS
    settings:
      base:
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets: [MarqueeTests]
  Marquee-iOS:
    templates: [App]
    platform: iOS
    # A film keeps playing with the screen locked (and in Picture in Picture).
    info:
      path: Generated/Info-iOS.plist
      properties:
        UIBackgroundModes: [audio]
        # xcodegen writes 1.0 and 1 otherwise, over the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Creating a recovery kit for your sync account checks that it is you.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Dark only (design v2), from the launch screen on.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme: {}
  Marquee-tvOS:
    templates: [App]
    platform: tvOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"
        # A plain launch screen, and dark from it on (the keyboard and alerts too), as on iOS.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    scheme: {}
  # Pure model tests: decoding of recorded core JSON and applyDiffs. No host app.
  MarqueeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: ["Fixtures/**"]
      - path: Marquee/Core/Models.swift
      - path: Marquee/Core/PlaybackModels.swift
      - path: Marquee/Core/ScreenModels.swift
      - path: Marquee/Core/AccountModels.swift
      - path: Marquee/Core/ListDiff.swift
      - path: Marquee/Title/TitleWords.swift
      - path: Marquee/App/TabBarRule.swift
      - path: Marquee/Versions/VersionWords.swift
      - path: Marquee/Core/ProfileModels.swift
      - path: Marquee/Core/DebridModels.swift
      - path: Marquee/Core/DebridStore.swift
      - path: Marquee/Core/DebridAccounts.swift
      - path: Marquee/Player/WebVTT.swift
      - path: Marquee/Player/PlayerLayout.swift
      - path: Marquee/Player/CaptionStyle.swift
      - path: Marquee/Sync/SyncWords.swift
      - path: Marquee/Settings/FindAddonsWords.swift
      - path: Marquee/Settings/FindAddonsRules.swift
      - path: Marquee/Theme/ArtLoader.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.marquee.dev.tests
        GENERATE_INFOPLIST_FILE: YES
