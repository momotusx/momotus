# Dependency policy: every license must be compatible with distributing the
# app under GPL-3.0-or-later, and known advisories fail the build.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
]

[advisories]
yanked = "deny"
# Unmaintained crates fail only when we depend on them directly; fxhash and
# derivative arrive through stremio-core.
unmaintained = "workspace"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/Stremio/stremio-core",
    "https://github.com/Stremio/local-search",
]

# The Stremio crates come from git and name no license in their manifests;
# both repositories are MIT (LICENSE.md in stremio-core, LICENSE in
# local-search).
[[licenses.clarify]]
crate = "stremio-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "stremio-derive"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "stremio-watched-bitfield"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "localsearch"
expression = "MIT"
license-files = []
