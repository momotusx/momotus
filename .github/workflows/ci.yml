name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.98.0
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal -c clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # The gate's three clippy sets; all three run, the step fails if any does.
      - run: |
          rc=0
          cargo clippy --locked --workspace --exclude mq-engine --all-targets -- -D warnings || rc=1
          cargo clippy --locked -p mq-engine --all-targets --features test-hooks -- -D warnings || rc=1
          cargo clippy --locked -p mq-runtime -p mq-bridge -p mq-ffi --features mq-runtime/plugins,mq-bridge/plugins,mq-ffi/plugins --all-targets -- -D warnings || rc=1
          exit $rc

  rust-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime, rest, hooks]
    steps:
      - name: Free disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-test-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash .github/scripts/rust-tests.sh ${{ matrix.shard }}

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        run: |
          sdk=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >>"$GITHUB_ENV"
      - run: rustup toolchain install 1.98.0 --profile minimal -t aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android
          workspaces: ". -> target-android-dev"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache keeps ~/.cargo/bin, so a warm run skips both installs.
      - name: cargo-ndk and uniffi-bindgen
        run: |
          [ "$(cargo ndk --version 2>/dev/null)" = "cargo-ndk 4.1.2" ] ||
            cargo install --locked cargo-ndk --version 4.1.2 --target-dir "$RUNNER_TEMP/install-target"
          [ "$(uniffi-bindgen --version 2>/dev/null)" = "uniffi-bindgen 0.32.2" ] ||
            cargo install --locked --path apps/android/tools/uniffi-bindgen --target-dir "$RUNNER_TEMP/install-target"
      # dev builds into <target>-dev: target-android-dev.
      - run: bash apps/android/scripts/build-core.sh dev
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-android
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Gradle (spotless, lint, unit tests)
        working-directory: apps/android
        run: bash scripts/gw.sh --no-daemon --continue spotlessCheck lintDebug testDebugUnitTest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ !cancelled() }}
        with:
          bun-version: 1.3.13
      - name: Script tests
        if: ${{ !cancelled() }}
        working-directory: apps/android
        run: |
          bun install --frozen-lockfile
          bun test scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-test-results
          path: |
            apps/android/*/build/test-results/
            apps/android/*/build/reports/
          retention-days: 7

  web-unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test src

  # The e2e's bridge, relay and mock provider, built once for the three shards. Dev profile, so the bridge's
  # MQ_DEV_ hooks are compiled in. One build per binary, as e2e/core.ts builds them (no feature unification).
  e2e-bins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e-bins
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          cargo build --locked -p mq-bridge
          cargo build --locked -p mq-sync-server
          cargo build --locked -p mq-sync-server --example mock-oidc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bins
          path: |
            target/debug/mq-bridge
            target/debug/mq-sync-server
            target/debug/examples/mock-oidc
          if-no-files-found: error
          retention-days: 1

  web-e2e:
    runs-on: ubuntu-24.04
    needs: e2e-bins
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-bins
          path: ${{ runner.temp }}/bins
      # Artifacts drop the executable bit.
      - run: chmod +x "$RUNNER_TEMP/bins/mq-bridge" "$RUNNER_TEMP/bins/mq-sync-server" "$RUNNER_TEMP/bins/examples/mock-oidc"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # The recorded addon answers (e2e/replay.ts), one cache per shard: each shard records its own tests.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/marquee-e2e/replay
          key: e2e-replay-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: e2e-replay-${{ matrix.shard }}-
      - run: bunx playwright test --shard=${{ matrix.shard }}/3
        env:
          MQ_BRIDGE_BIN: ${{ runner.temp }}/bins/mq-bridge
          MQ_SYNC_SERVER_BIN: ${{ runner.temp }}/bins/mq-sync-server
          MQ_MOCK_OIDC_BIN: ${{ runner.temp }}/bins/examples/mock-oidc
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          path: ~/.cache/marquee-e2e/replay
          key: e2e-replay-${{ matrix.shard }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7

  apple-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal -t aarch64-apple-darwin,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: apple-test
          workspaces: ". -> target-apple-dev"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: uniffi-bindgen and xcodegen
        run: |
          [ "$(uniffi-bindgen --version 2>/dev/null)" = "uniffi-bindgen 0.32.2" ] ||
            cargo install --locked --path apps/android/tools/uniffi-bindgen --target-dir "$RUNNER_TEMP/install-target"
          brew install xcodegen
      # --dev builds into <target>-dev: target-apple-dev.
      - run: bash apps/apple/scripts/build-core.sh --dev
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-apple
      - run: xcodegen generate
        working-directory: apps/apple
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/spm-packages
          key: spm-${{ hashFiles('apps/apple/project.yml', 'apps/apple/Vendor/AetherEngine/Package.swift') }}
          restore-keys: spm-
      - name: macOS tests
        working-directory: apps/apple
        run: >
          xcodebuild test -project Marquee.xcodeproj -scheme Marquee-macOS
          -destination 'platform=macOS,arch=arm64' -clonedSourcePackagesDirPath "$HOME/spm-packages"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          path: ~/spm-packages
          key: spm-${{ hashFiles('apps/apple/project.yml', 'apps/apple/Vendor/AetherEngine/Package.swift') }}

  apple-build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal -t aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-tvos
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: apple-build
          workspaces: ". -> target-apple"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: uniffi-bindgen and xcodegen
        run: |
          [ "$(uniffi-bindgen --version 2>/dev/null)" = "uniffi-bindgen 0.32.2" ] ||
            cargo install --locked --path apps/android/tools/uniffi-bindgen --target-dir "$RUNNER_TEMP/install-target"
          brew install xcodegen
      # The script only refuses an empty token; nothing this job builds is uploaded.
      - run: bash apps/apple/scripts/build-core.sh --tvos
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-apple
          MARQUEE_TMDB_READ_TOKEN: ci-compile-only
      - run: xcodegen generate
        working-directory: apps/apple
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/spm-packages
          key: spm-${{ hashFiles('apps/apple/project.yml', 'apps/apple/Vendor/AetherEngine/Package.swift') }}
          restore-keys: spm-
      - name: iOS and tvOS builds
        working-directory: apps/apple
        run: |
          xcodebuild build -project Marquee.xcodeproj -scheme Marquee-iOS -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" CODE_SIGNING_ALLOWED=NO
          xcodebuild build -project Marquee.xcodeproj -scheme Marquee-tvOS -destination 'generic/platform=tvOS' \
            -clonedSourcePackagesDirPath "$HOME/spm-packages" CODE_SIGNING_ALLOWED=NO
