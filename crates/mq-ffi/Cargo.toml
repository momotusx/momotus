[package]
name = "mq-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "marquee_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
# Built-in torrent engine: `full` (sideload) builds only, never store builds.
torrent = ["mq-runtime/torrent"]

[dependencies]
mq-runtime = { path = "../mq-runtime" }
mq-bridge = { path = "../mq-bridge" }
uniffi = "0.32"
tokio = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
# The platform certificate verifier needs the JVM (see `android` in lib.rs). Both crates
# are already in the graph through reqwest.
jni = "0.22"
rustls-platform-verifier = "0.7"

[target.'cfg(target_vendor = "apple")'.dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
