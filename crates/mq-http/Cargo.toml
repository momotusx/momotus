[package]
name = "mq-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `test_dns::set`: tests point a name at a fixture. Only dev-dependencies enable it.
test-dns = []

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "stream", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["net"] }
futures-util = "0.3"
bytes = "1"
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# getifaddrs: the device's own addresses and on-link prefixes.
libc = "0.2"

[dev-dependencies]
mq-http = { path = ".", features = ["test-dns"] }
tokio = { workspace = true, features = ["net", "io-util"] }
