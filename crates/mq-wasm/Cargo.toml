[package]
name = "mq-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The webOS core (plans/webos.md 3.5), built by apps/webos/scripts/build-wasm.sh.
[lib]
crate-type = ["cdylib"]

[features]
# The web e2e's hooks (Trakt, TMDB, segments, replay, Cinemeta and Stremio
# fakes) from the config's `dev` map; debug-assertion builds only.
dev-hooks = []

# Nothing natively: the crate is empty off wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
mq-bridge = { path = "../mq-bridge", default-features = false }
mq-runtime = { path = "../mq-runtime" }
mq-server = { path = "../mq-server" }
mq-http = { path = "../mq-http" }
mq-rt = { path = "../mq-rt" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
url.workspace = true
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3"
