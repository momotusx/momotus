[package]
name = "mq-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Serve files of the embedded torrent engine (full builds only).
torrent = ["dep:mq-engine"]
# Tests of torrent setup cancelled halfway (the engine's range barrier).
test-hooks = ["torrent", "mq-engine/test-hooks"]

[dependencies]
mq-rt = { path = "../mq-rt" }
mq-http = { path = "../mq-http" }
mq-media = { path = "../mq-media" }
mq-engine = { path = "../mq-engine", optional = true }
futures-util = "0.3"
bytes = "1"
http = "1"
getrandom = "0.3"
encoding_rs = "0.8"
# DASH manifests (plans/c21-c23-loopback.md 3.3); already in Cargo.lock.
quick-xml = "0.41"
flate2 = "1"
thiserror.workspace = true
url.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["net", "fs", "io-util"] }
axum = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }

[dev-dependencies]
mq-http = { path = "../mq-http", features = ["test-dns"] }
tokio = { workspace = true, features = ["net", "io-util", "fs", "process"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
