[package]
name = "mq-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Serve files of the embedded torrent engine (full builds only).
torrent = ["dep:mq-engine"]
# Tests of torrent setup cancelled halfway (the engine's range barrier).
test-hooks = ["torrent", "mq-engine/test-hooks"]

[dependencies]
mq-http = { path = "../mq-http" }
mq-media = { path = "../mq-media" }
mq-engine = { path = "../mq-engine", optional = true }
axum = "0.8"
tokio = { workspace = true, features = ["net"] }
futures-util = "0.3"
bytes = "1"
getrandom = "0.3"
encoding_rs = "0.8"
flate2 = "1"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
mq-http = { path = "../mq-http", features = ["test-dns"] }
tokio = { workspace = true, features = ["net", "io-util"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
