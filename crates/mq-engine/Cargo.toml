[package]
name = "mq-engine"
description = "Embedded torrent streaming engine: a librqbit fork driven by the DWH scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# A barrier inside range setup, for tests of callers that cancel it.
test-hooks = []

[dependencies]
librqbit = { path = "../../vendor/librqbit", default-features = false, features = ["rust-tls", "disable-upload"] }
mq-engine-sched = { path = "../mq-engine-sched" }
mq-relparse = { path = "../mq-relparse" }
# The address policy every peer must pass (plans/c27-torrent-policy.md).
mq-http = { path = "../mq-http" }
anyhow = "1"
tokio = { workspace = true, features = ["fs", "io-util"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
mq-http = { path = "../mq-http", features = ["test-dns"] }
