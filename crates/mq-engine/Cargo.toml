[package]
name = "mq-engine"
description = "Embedded torrent streaming engine: a librqbit fork driven by the DWH scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
librqbit = { path = "../../vendor/librqbit", default-features = false, features = ["rust-tls", "disable-upload"] }
mq-engine-sched = { path = "../mq-engine-sched" }
mq-relparse = { path = "../mq-relparse" }
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { workspace = true, features = ["fs", "io-util"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
