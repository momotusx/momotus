[package]
name = "mq-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mq"
path = "src/main.rs"

[dependencies]
mq-runtime = { path = "../mq-runtime", features = ["torrent"] }
mq-engine = { path = "../mq-engine" }
mq-server = { path = "../mq-server", features = ["torrent"] }
url.workspace = true
libc = "0.2"
mq-streams = { path = "../mq-streams" }
mq-sync = { path = "../mq-sync" }
mq-library = { path = "../mq-library" }
mq-addons = { path = "../mq-addons" }
mq-protocol = { path = "../mq-protocol" }
mq-http = { path = "../mq-http" }
mq-media = { path = "../mq-media" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["process", "net", "io-util"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
mq-sync-server = { path = "../mq-sync-server" }
