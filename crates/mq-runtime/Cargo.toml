[package]
name = "mq-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
ts = ["dep:ts-rs", "mq-streams/ts", "mq-sync/ts"]
# Built-in torrent engine (full builds; store builds play torrents only
# through debrid).
torrent = ["dep:mq-engine", "mq-server/torrent"]

[dependencies]
ts-rs = { version = "12", optional = true, features = ["serde-compat"] }
mq-http = { path = "../mq-http" }
mq-protocol = { path = "../mq-protocol" }
mq-addons = { path = "../mq-addons" }
mq-library = { path = "../mq-library" }
mq-streams = { path = "../mq-streams" }
mq-relparse = { path = "../mq-relparse" }
mq-server = { path = "../mq-server" }
mq-debrid = { path = "../mq-debrid" }
mq-import = { path = "../mq-import" }
mq-media = { path = "../mq-media" }
mq-sync = { path = "../mq-sync" }
mq-engine = { path = "../mq-engine", optional = true }
bytes = "1"
getrandom = "0.3"
stremio-core.workspace = true
eyeball = "0.8"
eyeball-im = "0.9"
imbl = "7"
futures-util = "0.3"
tokio = { workspace = true }
tokio-util = "0.7"
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
mq-relparse = { path = "../mq-relparse" }
mq-streams = { path = "../mq-streams" }
