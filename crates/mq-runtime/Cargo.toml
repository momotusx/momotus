[package]
name = "mq-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
ts = ["dep:ts-rs", "mq-streams/ts", "mq-sync/ts"]
# Built-in torrent engine (full builds; store builds play torrents only
# through debrid).
torrent = ["dep:mq-engine", "mq-server/torrent"]
# The engine's range barrier, for tests of a playback stopped mid-setup.
test-hooks = ["torrent", "mq-engine/test-hooks"]

[dependencies]
ts-rs = { version = "12", optional = true, features = ["serde-compat"] }
mq-http = { path = "../mq-http" }
mq-protocol = { path = "../mq-protocol" }
mq-addons = { path = "../mq-addons" }
mq-library = { path = "../mq-library" }
mq-streams = { path = "../mq-streams" }
mq-relparse = { path = "../mq-relparse" }
mq-server = { path = "../mq-server" }
mq-debrid = { path = "../mq-debrid" }
mq-import = { path = "../mq-import" }
mq-media = { path = "../mq-media" }
mq-sync = { path = "../mq-sync" }
mq-tracking = { path = "../mq-tracking" }
mq-engine = { path = "../mq-engine", optional = true }
bytes = "1"
# Reading addon links' config segments (`carries_token`).
base64 = "0.22"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.3"
# PIN hashing (plans/m11-profiles.md section 3); the salt comes from getrandom.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
stremio-core.workspace = true
eyeball = "0.8"
eyeball-im = "0.9"
imbl = "7"
futures-util = "0.3"
tokio = { workspace = true }
tokio-util = "0.7"
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
mq-http = { path = "../mq-http", features = ["test-dns"] }
mq-relparse = { path = "../mq-relparse" }
mq-streams = { path = "../mq-streams" }
# Tests make a stored row unreadable behind the library's back.
rusqlite = "0.40"
# The engine's loopback swarm (tests/kids_play.rs, feature torrent).
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
