[package]
name = "mq-sync-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mq-sync-server"
path = "src/main.rs"

[dependencies]
mq-sync = { path = "../mq-sync" }
mq-library = { path = "../mq-library" }
# Error and crash reports (plans/error-reports.md 7): the shape, checks and scrubber.
mq-reports = { path = "../mq-reports" }
axum = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { workspace = true, features = ["net", "signal"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
getrandom = "0.3"
tracing.workspace = true
# The binary's log lines (main.rs), to stderr.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# Sign-in (src/identity.rs): provider calls, ID token checks, Apple's secrets.
mq-http = { path = "../mq-http" }
ring = "0.17"
hmac = "0.13"
url.workspace = true

[dev-dependencies]
# The tests' browser: one that does not follow redirects.
reqwest = { version = "0.13", default-features = false, features = ["form"] }
proptest = "1"
hkdf = "0.13"
