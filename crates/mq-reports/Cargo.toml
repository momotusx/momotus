[package]
name = "mq-reports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Error and crash reports (plans/error-reports.md): the shape devices send,
# the scrubber and the checks. The core's uploader and the relay's endpoint
# both run them, so the two sides never disagree.
[dependencies]
serde.workspace = true
serde_json.workspace = true
regex = "1"
sha2 = "0.11"

[dev-dependencies]
proptest = "1"
