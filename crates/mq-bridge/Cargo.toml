[package]
name = "mq-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mq-bridge"
path = "src/main.rs"

[features]
# The built-in torrent engine. The dev bridge (apps/web/scripts/bridge.sh)
# builds it in; the web e2e builds without it, so a run never touches
# BitTorrent.
torrent = ["mq-runtime/torrent"]

[dependencies]
mq-http = { path = "../mq-http" }
mq-library = { path = "../mq-library" }
mq-runtime = { path = "../mq-runtime" }
mq-streams = { path = "../mq-streams" }
mq-sync = { path = "../mq-sync" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
tokio = { workspace = true, features = ["net", "signal"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
mq-http = { path = "../mq-http", features = ["test-dns"] }
tokio-tungstenite = "0.28"
mq-sync-server = { path = "../mq-sync-server" }
# The relay's mock provider (mq-sync-server/tests/support/mock_oidc.rs).
ring = "0.17"
base64 = "0.22"
url.workspace = true
# The codec names the Apple caps test checks by type.
mq-relparse = { path = "../mq-relparse" }
reqwest = { version = "0.13", default-features = false, features = ["form"] }
