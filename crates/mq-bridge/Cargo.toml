[package]
name = "mq-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mq-bridge"
path = "src/main.rs"

[dependencies]
mq-runtime = { path = "../mq-runtime" }
mq-streams = { path = "../mq-streams" }
mq-sync = { path = "../mq-sync" }
hex = "0.4"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
tokio = { workspace = true, features = ["net", "signal"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio-tungstenite = "0.28"
mq-sync-server = { path = "../mq-sync-server" }
